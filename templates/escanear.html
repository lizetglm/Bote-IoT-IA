{% extends "base_app.html" %}
{% block titulo %}Escanear QR · Basurin{% endblock %}

{% block contenido %}
<section class="rounded-3xl border-2 border-dashed border-gray-300 bg-white p-8 text-center">
  <h1 class="text-2xl font-extrabold text-gray-900">Escanear QR</h1>
  <p class="mt-2 text-gray-500">Pantalla en construcción.</p>
  <p class="mt-1 text-sm text-gray-500">Lo que debe hacer está descrito en <code>static/js/escanear.js</code>.</p>
</section>
{% endblock %}

{% block scripts %}
  <script>
    // Con /v/<id> (destino del QR del bote) llega el id del bote; con /escanear es null.
    // El token viene en la URL: /v/<id>?t=<token>
    window.BOTE_ID = {{ bote_id | default(none) | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/escanear.js') }}"></script>
{% endblock %}
