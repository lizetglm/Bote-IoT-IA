{% extends "base.html" %}
{% block titulo %}Ingresar · EcoSort{% endblock %}

{% block contenido %}
<section class="w-full max-w-md bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
  <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-2">¡Hola de nuevo!</h1>
  <p class="text-center text-gray-500 mb-8">Ingresa para sumar puntos en este bote.</p>

  <form class="space-y-5" id="form-ingresar">
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Correo electrónico</label>
      <input type="email" name="correo" autocomplete="email" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-eco-500 focus:border-eco-500 outline-none transition">
    </div>
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña</label>
      <input type="password" name="contrasena" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-eco-500 focus:border-eco-500 outline-none transition">
    </div>
    <button class="w-full bg-eco-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-eco-700 shadow-md transition disabled:opacity-70" type="submit">
      Ingresar
    </button>
  </form>

  <p class="mensaje text-center text-sm font-medium mt-4" id="mensaje" role="status"></p>

  <p class="text-center text-sm text-gray-600 mt-6">
    ¿No tienes cuenta? <a href="{{ url_for('registro') }}" class="text-eco-600 font-bold hover:underline">Regístrate aquí</a>
  </p>
</section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
